<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La respuesta perfecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f3; --surface: #ffffff; --ink: #18242f; --muted: #5b6b78; --line: #d3dae0;
    --accent: #1f4e6b; --accent-ink: #ffffff; --pen: #b3261e; --hint-bg: #eaf1f6;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11181e; --surface: #19232b; --ink: #e6ebef; --muted: #9aabb8; --line: #2c3a45;
      --accent: #7fb2d3; --accent-ink: #0e1a22; --pen: #ff8f86; --hint-bg: #1c2d3a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55;
         padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 18px 64px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 24px; max-width: 58ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-weight: 500; margin: 0 0 6px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  textarea { resize: vertical; min-height: 110px; }
  .field { margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .examples button { font-weight: 500; font-size: 14px; padding: 6px 12px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 15px; margin: 0; }
  .error { color: var(--pen); font-size: 15px; margin: 14px 0 0; }

  .memo { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 28px 26px 18px; margin-bottom: 20px; }
  .memo header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; color: var(--muted); font-size: 14px; }
  .memo header strong { color: var(--ink); font-weight: 600; }
  .memo p { font-family: var(--serif); font-size: 18px; line-height: 1.7; margin: 0 0 14px; max-width: 64ch; }
  .memo p.disclaimer { font-family: var(--sans); font-size: 12px; line-height: 1.4; color: var(--muted); margin: 18px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
  .reveal-box { margin: 0 0 20px; }
  .reveal-box button.link { background: none; border: 0; color: var(--muted); font-weight: 400; font-size: 13px; padding: 4px 0; text-decoration: underline; }
  .reveal-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .reveal-row input { width: 140px; }
  .correction { border-left: 4px solid var(--pen); background: var(--hint-bg); border-radius: 0 8px 8px 0; padding: 16px 18px; margin-top: 12px; }
  .correction h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 6px; color: var(--pen); }
  .correction p { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>La respuesta perfecta</h1>
  <p class="lede">Escribe tu cargo y una pregunta de tu trabajo.</p>

  <section class="card" id="form-card">
    <div class="examples" id="examples" aria-label="Ejemplos"></div>
    <div class="field">
      <label for="role">Tu cargo o rol</label>
      <input id="role" type="text" maxlength="120" placeholder="Por ejemplo: jefa de recursos humanos">
    </div>
    <div class="field">
      <label for="question">Tu pregunta</label>
      <textarea id="question" maxlength="1000" placeholder="Describe tu situación con los datos que conoces."></textarea>
    </div>
    <div class="actions">
      <button id="go" type="button">Pedir respuesta</button>
      <span class="status" id="busy" hidden>Pensando…</span>
    </div>
    <div class="error" id="error" role="alert" hidden></div>
  </section>

  <section id="result" hidden>
    <div id="memo-holder"></div>
    <div class="reveal-box">
      <button id="reveal-open" type="button" class="link">Ver omisión</button>
      <div class="reveal-row" id="reveal-row" hidden>
        <input id="reveal-code" type="password" inputmode="numeric" autocomplete="off" aria-label="Código" placeholder="Código">
        <button id="reveal-go" type="button">Ver</button>
      </div>
      <div class="error" id="reveal-error" role="alert" hidden></div>
      <section class="correction" id="correction" hidden>
        <h2>Lo que la respuesta ignoró</h2>
        <p id="correction-text"></p>
      </section>
    </div>
    <button id="again" type="button" class="ghost">Hacer otra pregunta</button>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DISCLAIMER = "No usar esta respuesta como referencia, está hecha sólo con fines académicos.";
  var EXAMPLES = [
    { role: "Gerente de operaciones", q: "Mi equipo de 6 personas está atrasado en las entregas. ¿Cómo lo resolvemos antes de fin de trimestre? Hoy no podemos contratar a nadie." },
    { role: "Directora de colegio", q: "Queremos pasar toda la comunicación con apoderados a una app nueva. ¿Cómo lo implementamos? Sabemos que cerca de la mitad de las familias no tiene datos móviles estables." },
    { role: "Jefe de marketing", q: "Tenemos USD 2.000 y un mes para lanzar un producto B2B. ¿Qué canal priorizamos?" }
  ];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function showError(msg) { var e = $("error"); e.textContent = msg || ""; e.hidden = !msg; }

  EXAMPLES.forEach(function (ex) {
    var b = el("button", "ghost", ex.role); b.type = "button";
    b.addEventListener("click", function () { $("role").value = ex.role; $("question").value = ex.q; });
    $("examples").appendChild(b);
  });

  function renderMemo(role, text) {
    var holder = $("memo-holder"); holder.textContent = "";
    var memo = el("article", "memo");
    var h = el("header");
    h.appendChild(document.createTextNode("Respuesta para "));
    h.appendChild(el("strong", null, role));
    memo.appendChild(h);
    text.split(/\n\s*\n/).forEach(function (p) { var t = p.trim(); if (t) memo.appendChild(el("p", null, t)); });
    memo.appendChild(el("p", "disclaimer", DISCLAIMER));
    holder.appendChild(memo);
  }

  var currentToken = null;

  async function ask() {
    var role = $("role").value.trim(), question = $("question").value.trim();
    showError("");
    if (!role || !question) { showError("Escribe tu cargo y tu pregunta para continuar."); return; }
    $("go").disabled = true; $("busy").hidden = false;
    try {
      var res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, question: question })
      });
      var data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) { showError(data.error || "Algo falló. Inténtalo de nuevo."); return; }
      renderMemo(role, data.respuesta);
      currentToken = data.token || null;
      $("reveal-row").hidden = true; $("reveal-error").hidden = true;
      $("correction").hidden = true; $("reveal-code").value = "";
      $("reveal-open").hidden = !currentToken;
      $("form-card").hidden = true;
      $("result").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      showError("No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.");
    } finally {
      $("go").disabled = false; $("busy").hidden = true;
    }
  }

  $("go").addEventListener("click", ask);
  $("reveal-open").addEventListener("click", function () {
    $("reveal-row").hidden = !$("reveal-row").hidden;
    if (!$("reveal-row").hidden) $("reveal-code").focus();
  });
  $("reveal-code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("reveal-go").click(); });
  $("reveal-go").addEventListener("click", async function () {
    var re = $("reveal-error"); re.hidden = true;
    var code = $("reveal-code").value.trim();
    if (!code || !currentToken) return;
    $("reveal-go").disabled = true;
    try {
      var res = await fetch("/api/reveal", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code, token: currentToken })
      });
      var data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) { re.textContent = data.error || "No se pudo mostrar la omisión."; re.hidden = false; return; }
      $("correction-text").textContent = data.omision;
      $("correction").hidden = false;
      $("reveal-row").hidden = true;
    } catch (e) {
      re.textContent = "No se pudo conectar. Inténtalo de nuevo."; re.hidden = false;
    } finally { $("reveal-go").disabled = false; }
  });

  $("again").addEventListener("click", function () {
    $("result").hidden = true; $("form-card").hidden = false;
    $("question").value = ""; $("question").focus();
  });
})();
</script>
</body>
</html>
